name: simple_todo_app
description: "A simple todo application built with Nylo framework"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0 <4.0.0"
dependencies:
  url_launcher: ^6.3.2
  google_fonts: ^6.3.2
  analyzer: ^9.0.0
  intl: ^0.20.2
  nylo_framework: ^6.9.1
  pretty_dio_logger: ^1.4.0
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.5.0
  font_awesome_flutter: ^10.12.0
  scaffold_ui: ^1.2.9
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "public/app_icon/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - public/fonts/
    - public/images/
    - public/app_icon/
    - lang/
    - .env
